<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RK TEST - Image Showcase</title>
    <link rel="stylesheet" href="styler.css">
    <style>
        /* Custom layout properties specifically for the grid matrix view */
        .gallery-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            box-sizing: border-box;
        }

        .gallery-header {
            padding: 20px;
            background-color: var(--panel-solid);
            border-bottom: 3px double var(--neon-cyan);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .gallery-header h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        .gallery-grid {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            min-height: 0;
        }

        /* 2000s Rigid Hardware Component Card Chassis */
        .art-frame {
            background: #0b111e;
            border: 1px solid var(--border-frame);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.15s ease;
        }

        .art-frame:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 234, 255, 0.2);
        }

        .art-frame img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 1px solid rgba(0, 234, 255, 0.1);
            background: #05070d;
            cursor: pointer; /* Signal interactiveness to user */
        }

        .art-meta {
            font-size: 0.75rem;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-top: 1px dashed var(--border-frame);
            padding-top: 8px;
        }

        /* 🛰️ FULLSCREEN LIGHTBOX TERMINAL MATRIX OVERLAY */
        .lightbox-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 13, 0.95); /* Matches --bg-matrix with heavy transparency */
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden; /* Prevent canvas overflowing page edges during intense zooms */
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 80%;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 234, 255, 0.3);
            background: #000;
            object-fit: contain;
            user-select: none; /* Stops text-selection bugs when dragging image */
            -webkit-user-drag: none; /* Disables standard browser ghost image dragging */
            cursor: grab; /* Informs user image can be repositioned */
            will-change: transform; /* Optimizes GPU redraw cycles during transforms */

            /*Force rendr Pixelperfect*/
            image-rendering: pixelated; 
            image-rendering: crisp-edges; /* Fallback support for older browser versions */
        }

        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 30px;
            color: var(--neon-pink);
            font-family: monospace;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
            background: rgba(255, 0, 85, 0.05);
            border: 1px solid var(--neon-pink);
            padding: 8px 16px;
            cursor: pointer;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.2);
            z-index: 10001;
        }

        .lightbox-close:hover {
            background: var(--neon-pink);
            color: var(--text-white);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        .lightbox-meta {
            position: absolute;
            bottom: 25px;
            color: var(--neon-green);
            font-family: monospace;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(0, 255, 122, 0.3);
            background: rgba(13, 19, 32, 0.8);
            padding: 6px 12px;
            border: 1px dashed rgba(0, 255, 122, 0.3);
            z-index: 10001;
        }

        /* Custom tracking scrollbar for the image container matrix */
        .gallery-grid::-webkit-scrollbar {
            width: 6px;
        }
        .gallery-grid::-webkit-scrollbar-track {
            background: #05070d;
            border-left: 1px solid var(--border-frame);
        }
        .gallery-grid::-webkit-scrollbar-thumb {
            background: var(--border-frame);
            border-radius: 3px;
        }
        .gallery-grid::-webkit-scrollbar-thumb:hover {
            background: var(--neon-cyan);
        }

        .back-btn {
            color: var(--neon-pink);
            text-decoration: none;
            border: 1px solid var(--neon-pink);
            padding: 8px 16px;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            background: rgba(255, 0, 85, 0.05);
        }

        .back-btn:hover {
            background: var(--neon-pink);
            color: var(--text-white);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }
    </style>
</head>
<body class="workspace-body" style="display: block; height: 100vh;">

    <div class="gallery-container">
        <div class="gallery-header">
            <h1 style="color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0, 234, 255, 0.4);">IMAGE_SHOWCASE_STORAGE //</h1>
            <a href="index.html" class="back-btn">← RETURN TO INDEX</a>
        </div>

        <div id="gallery-grid" class="gallery-grid">
        </div>
    </div>

    <div id="lightbox" class="lightbox-overlay">
        <button id="lightbox-close" class="lightbox-close">[X] CLOSE_VIEW</button>
        <img id="lightbox-img" class="lightbox-content" src="" alt="Fullscreen Terminal Asset">
        <div id="lightbox-meta" class="lightbox-meta"></div>
    </div>

    <script>
        const targetFolder = 'Images/';
        const grid = document.getElementById('gallery-grid');
        
        // Grab Lightbox DOM Elements
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxMeta = document.getElementById('lightbox-meta');
        const lightboxClose = document.getElementById('lightbox-close');

        // 🛰️ GLOBAL COORDINATE STATE REGISTER FOR ZOOM & PANNING
        let zoomScale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        // Render Transform Update Vector
        function applyMatrixTransformation() {
            lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${zoomScale})`;
            
            // Appends standard info combined with current magnification values
            const baseInfo = lightboxImg.getAttribute('data-meta-base');
            lightboxMeta.innerText = `${baseInfo} // [ZOOM: ${Math.round(zoomScale * 100)}%]`;
        }

        // 1. Fetch the explicit asset list array from your imagesList.json file map
        fetch('imagesList.json')
            .then(response => {
                if (!response.ok) throw new Error("JSON file deployment missing");
                return response.json();
            })
            .then(imageFiles => {
                let imgCount = 0;

                imageFiles.forEach(filename => {
                    imgCount++;
                    
                    // 2. Generate the tactical console card layout framework
                    const frame = document.createElement('div');
                    frame.className = 'art-frame';

                    const img = document.createElement('img');
                    img.alt = filename;

                    // 🛠️ THE IMAGE RESOLUTION CONDITIONAL SWITCH
                    img.onload = function() {
                        const width = this.naturalWidth;
                        const height = this.naturalHeight;

                        // Check resolution bounds against your precise hardware threshold
                        if (width < 320 && height < 220) {
                            this.style.imageRendering = 'pixelated';
                            console.log(`[RENDER ENGINE] Pixel-Perfect Enforced: ${filename} (${width}x${height})`);
                        } else {
                            this.style.imageRendering = 'auto';
                            console.log(`[RENDER ENGINE] Standard Smoothing Allowed: ${filename} (${width}x${height})`);
                        }
                    };

                    // 🛠️ INTERCEPT CLICK EVENT FOR FULLSCREEN VIEW
                    img.onclick = function() {
                        lightboxImg.src = this.src;
                        // Synchronize the pixelated scale architecture over to the full view container!
                        lightboxImg.style.imageRendering = this.style.imageRendering;
                        
                        // Reset spatial registers on initialization
                        zoomScale = 1;
                        translateX = 0;
                        translateY = 0;

                        const baseMetaText = `[SYS_PREVIEW_MODE] // ${filename} (${this.naturalWidth}x${this.naturalHeight})`;
                        lightboxImg.setAttribute('data-meta-base', baseMetaText);
                        
                        lightbox.style.display = 'flex';
                        applyMatrixTransformation();
                    };

                    // Trigger the image data stream load
                    img.src = targetFolder + filename;

                    const meta = document.createElement('div');
                    meta.className = 'art-meta';
                    meta.innerText = `[SYS_IMG_${imgCount.toString().padStart(3, '0')}] ${filename}`;

                    frame.appendChild(img);
                    frame.appendChild(meta);
                    grid.appendChild(frame);
                });

                // Display warning if array is completely blank
                if (imgCount === 0) {
                    grid.innerHTML = `<div style="color: var(--neon-pink); grid-column: 1/-1; text-align: center; padding-top: 40px; font-weight: bold;">
                        [WARNING] NO RECOGNIZED ASSETS DEPLOYED INSIDE 'imagesList.json'.
                    </div>`;
                }
            })
            .catch(err => {
                console.error("Database initialization error:", err);
                grid.innerHTML = `<div style="color: var(--neon-pink); grid-column: 1/-1; text-align: center; padding-top: 40px; font-weight: bold;">
                    [CRITICAL ERROR] FAILED TO READ 'imagesList.json' CORE MAP.<br>
                    ENSURE FILE IS COMMITTED TO YOUR GIT REPOSITORY AND CASING MATCHES EXACTLY.
                </div>`;
            });

        // 🎛️ MODAL CLOSING LOGIC CONTROL SEQUENCE
        function deactivateLightbox() {
            lightbox.style.display = 'none';
            lightboxImg.src = ''; // Purges cache link memory allocation to stop layout leaks
        }

        // Close via Button
        lightboxClose.onclick = deactivateLightbox;

        // Close if user clicks anywhere on the dark overlay background area
        lightbox.onclick = function(e) {
            if (e.target === lightbox) {
                deactivateLightbox();
            }
        };

        // Escape Key Global Hardware Handler Execution
        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && lightbox.style.display === 'flex') {
                deactivateLightbox();
            }
        });


        // ==========================================================================
        // 🛰️ HARDWARE MOUSE INTERFACE CONTROLS (ZOOM & PAN EXECUTION)
        // ==========================================================================

        // 1. Mouse Scroll Wheel Scaler
        lightbox.addEventListener('wheel', function(e) {
            if (lightbox.style.display !== 'flex') return;
            e.preventDefault(); // Defuses standard browser page-scroll behaviors

            // Geometric scaling step calculation factor
            const scalingFactor = 1.15;
            
            if (e.deltaY < 0) {
                zoomScale *= scalingFactor; // Zoom In
            } else {
                zoomScale /= scalingFactor; // Zoom Out
            }

            // Hard constraints: 0.4x (for massive 2K arrays) to 64.0x (for micro 32x32 sprites)
            zoomScale = Math.max(0.4, Math.min(zoomScale, 64));

            applyMatrixTransformation();
        }, { passive: false });

        // 2. Click and Drag Panning Core Logic
        lightboxImg.addEventListener('mousedown', function(e) {
            e.preventDefault(); // Suppresses default image copy-dragging outlines
            isDragging = true;
            
            // Calculates relative start offset coordinates
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            
            lightboxImg.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            // Evaluates real-time vector translation distance
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            
            applyMatrixTransformation();
        });

        window.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                lightboxImg.style.cursor = 'grab';
            }
        });

        // Safety fallback anchor: Cancels tracking if mouse exits active viewport space
        window.addEventListener('mouseleave', function() {
            if (isDragging) {
                isDragging = false;
                lightboxImg.style.cursor = 'grab';
            }
        });
    </script>
</body>
</html>

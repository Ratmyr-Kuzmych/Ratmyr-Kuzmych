<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RK TEST - Audio Terminal</title>
    <link rel="stylesheet" href="styler.css">
    <style>
        /* Layout Framework for Audio Matrix */
        .audio-container {
            display: flex;
            height: 100vh;
            max-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 🎛️ CENTRAL CONTROL STATION DECK PANEL */
        #deck-panel {
            width: 360px;
            background-color: var(--panel-solid);
            border-right: 3px double var(--neon-cyan);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        #deck-panel h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--neon-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 234, 255, 0.4);
            border-bottom: 1px dashed var(--border-frame);
            padding-bottom: 10px;
        }

        /* Tactical Audio Player Subassembly */
        .player-chassis {
            background: #05070d;
            border: 1px solid var(--border-frame);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #track-title {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--neon-green);
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 6px rgba(0, 255, 122, 0.3);
        }

        /* Retro stylized raw HTML audio overrides */
        audio {
            width: 100%;
            height: 32px;
            outline: none;
            filter: invert(1) hue-rotate(180deg); /* Blends standard browser controls into retro theme */
            opacity: 0.85;
        }

        audio:hover {
            opacity: 1;
        }

        /* 🛰️ AUDIO INVENTORY GRID MATRIX */
        #inventory-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .inventory-header {
            padding: 20px 30px;
            background-color: var(--panel-solid);
            border-bottom: 1px solid var(--border-frame);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inventory-header h1 {
            margin: 0;
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--text-white);
        }

        .music-grid {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            min-height: 0;
        }

        /* Interactive Audio Cassette Rack Item */
        .track-card {
            background: #0b111e;
            border: 1px solid var(--border-frame);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .track-card:hover {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 122, 0.15);
            background: rgba(0, 255, 122, 0.02);
        }

        .track-card.active-runtime {
            border-color: var(--neon-pink);
            box-shadow: inset 0 0 10px rgba(255, 47, 146, 0.15);
            background: rgba(255, 47, 146, 0.03);
        }

        .track-icon {
            font-size: 1.5rem;
            color: var(--text-gray);
        }

        .track-card.active-runtime .track-icon {
            color: var(--neon-pink);
            animation: pulse-glow 1.5s infinite ease-in-out;
        }

        .track-meta {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .track-name {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-path {
            font-size: 0.7rem;
            color: var(--text-gray);
            font-family: monospace;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Webkit layout standard scrollbar adjustments */
        .music-grid::-webkit-scrollbar {
            width: 6px;
        }
        .music-grid::-webkit-scrollbar-track {
            background: #05070d;
            border-left: 1px solid var(--border-frame);
        }
        .music-grid::-webkit-scrollbar-thumb {
            background: var(--border-frame);
            border-radius: 3px;
        }
        .music-grid::-webkit-scrollbar-thumb:hover {
            background: var(--neon-cyan);
        }

        .return-btn {
            margin-top: auto;
            color: var(--neon-pink);
            text-decoration: none;
            border: 1px solid var(--neon-pink);
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            background: rgba(255, 0, 85, 0.05);
        }

        .return-btn:hover {
            background: var(--neon-pink);
            color: var(--text-white);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }
    </style>
</head>
<body class="workspace-body" style="display: block; margin: 0; padding: 0;">

    <div class="audio-container">
        
        <div id="deck-panel">
            <h2>Audio Deck System</h2>
            
            <div class="player-chassis">
                <div id="track-title">STREAM STATUS: STANDBY_</div>
                <audio id="audio-core-engine" controls controlsList="nodownload" oncontextmenu="return false;"></audio>
            </div>

            <a href="index.html" class="return-btn">← RETURN TO INDEX</a>
        </div>

        <div id="inventory-area">
            <div class="inventory-header">
                <h1 style="color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0, 234, 255, 0.3);">MUZIKA_DIRECTORY_STREAM //</h1>
            </div>

            <div id="music-grid" class="music-grid">
                </div>
        </div>

    </div>

    <script>
        const targetFolder = 'Muzika/';
        const grid = document.getElementById('music-grid');
        const audioEngine = document.getElementById('audio-core-engine');
        const trackTitle = document.getElementById('track-title');

        // Fetch execution mapping system
        fetch('musicList.json')
            .then(response => {
                if (!response.ok) throw new Error("Manifest config array missing");
                return response.json();
            })
            .then(tracks => {
                let trackCount = 0;

                tracks.forEach(filename => {
                    trackCount++;
                    const fullPath = targetFolder + filename;

                    // Building interactive rack chassis elements
                    const card = document.createElement('div');
                    card.className = 'track-card';

                    // Clean name string presentation filter
                    const cleanName = filename.replace(/\.[^/.]+$/, "").replace(/_/g, " ");

                    card.innerHTML = `
                        <div class="track-icon">🎚️</div>
                        <div class="track-meta">
                            <div class="track-name">${cleanName}</div>
                            <div class="track-path">[SYS_FILE_${trackCount.toString().padStart(3, '0')}] ${filename}</div>
                        </div>
                    `;

                    // Intercepting click routines to dynamically fire new audio data buffers
                    card.onclick = function() {
                        // Deactivate all active highlight layers
                        document.querySelectorAll('.track-card').forEach(c => c.classList.remove('active-runtime'));
                        
                        // Activate current node link
                        card.classList.add('active-runtime');

                        // Deploy audio data stream execution
                        audioEngine.src = fullPath;
                        trackTitle.innerText = `ACTIVE_STREAM: ${filename}`;
                        audioEngine.play();
                    };

                    grid.appendChild(card);
                });

                if (trackCount === 0) {
                    grid.innerHTML = `<div style="color: var(--neon-pink); font-weight: bold; text-align: center; grid-column: 1/-1; padding-top: 40px;">
                        [WARNING] NO RECOGNIZED AUDIO ASSETS DETECTED IN 'musicList.json'.
                    </div>`;
                }
            })
            .catch(err => {
                console.error("Database tracking link mapping breakdown:", err);
                grid.innerHTML = `<div style="color: var(--neon-pink); font-weight: bold; text-align: center; grid-column: 1/-1; padding-top: 40px;">
                    [CRITICAL ERROR] FAILED TO COMPILE AUDIO BUFFER MAP 'musicList.json'.<br>
                    VERIFY TARGET FOLDER STRATIFICATION PATTERNS.
                </div>`;
            });
    </script>
</body>
</html>
